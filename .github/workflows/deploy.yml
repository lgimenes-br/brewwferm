name: Deploy Automático na Locaweb

on:
  push:
    branches:
      - main

concurrency:
  group: deploy-locaweb
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-24.04
    steps:
      - name: 1. Pegando o código completo do GitHub
        uses: actions/checkout@v5

      - name: 2. Preparando o computador da nuvem
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: 3. Construindo o Layout novo (Build)
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          VITE_VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
        run: |
          npm install --legacy-peer-deps
          npx tsc --noEmit
          npm test
          npm run build

      - name: 3.5. Limpando lixo e verificando disco (SSH)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: 22
          script: |
            echo "--- ANTES DA LIMPEZA ---"
            df -h
            echo "--- LIMPANDO /tmp ---"
            rm -f /tmp/*.tar.gz
            echo "--- DEPOIS DA LIMPEZA ---"
            df -h

      - name: 3.6. Pausa para o Firewall da Locaweb (Rate Limit)
        run: sleep 15

      - name: 4. Copiando a vitrine (Frontend) para a Locaweb
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: 22
          source: "dist/*" 
          target: "/var/www/breww.live/html/"
          strip_components: 1

      - name: 4.5. Pausa para o Firewall
        run: sleep 15

      - name: 5. Copiando o motor (Backend) para a Locaweb
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: 22
          source: "backend/*" 
          target: "/var/www/breww-backend/"
          strip_components: 1

      - name: 5.5. Pausa para o Firewall
        run: sleep 15

      - name: 6. Reiniciando a fermentação silenciosamente
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: 22
          script: |
            cd /var/www/breww-backend/
            chmod +x mosquitto/setup-vps-mosquitto.sh 2>/dev/null || true
            bash mosquitto/setup-vps-mosquitto.sh || true
            bash deploy/setup-nginx.sh || true
            bash deploy/setup-firewall.sh || true
            bash deploy/setup-backup.sh || true
            bash deploy/diag-firewall.sh || true
            if [ ! -f .env ] || ! grep -q "^VITE_GEMINI_API_KEY=" .env; then echo "VITE_GEMINI_API_KEY=${{ secrets.VITE_GEMINI_API_KEY }}" >> .env; else sed -i "s|^VITE_GEMINI_API_KEY=.*|VITE_GEMINI_API_KEY=${{ secrets.VITE_GEMINI_API_KEY }}|" .env; fi
            if [ -n "${{ secrets.FIRMWARE_UPLOAD_TOKEN }}" ]; then if grep -q "^FIRMWARE_UPLOAD_TOKEN=" .env; then sed -i "s|^FIRMWARE_UPLOAD_TOKEN=.*|FIRMWARE_UPLOAD_TOKEN=${{ secrets.FIRMWARE_UPLOAD_TOKEN }}|" .env; else echo "FIRMWARE_UPLOAD_TOKEN=${{ secrets.FIRMWARE_UPLOAD_TOKEN }}" >> .env; fi; fi
            # Chaves VAPID (push do navegador) vindas dos segredos do GitHub; trocadas em 11/11/2026
            if [ -n "${{ secrets.VAPID_PRIVATE_KEY }}" ]; then for KV in "VAPID_PUBLIC_KEY=${{ secrets.VAPID_PUBLIC_KEY }}" "VAPID_PRIVATE_KEY=${{ secrets.VAPID_PRIVATE_KEY }}"; do K="${KV%%=*}"; if grep -q "^${K}=" .env; then sed -i "s|^${K}=.*|${KV}|" .env; else echo "${KV}" >> .env; fi; done; fi
            npm install
            pm2 startOrRestart ecosystem.config.cjs --only breww-server || pm2 restart breww-server
            pm2 save
