
<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Breww — Controle de fermentação no celular</title>
    <meta name="description" content="Controle de fermentação de cerveja no celular: perfis automáticos, alertas e histórico de lotes. Use a placa Breww ou monte a sua com um ESP32.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@300;400;500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <meta name="theme-color" content="#000000" />
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" sizes="180x180" />
    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="icon" href="/logo.svg" type="image/svg+xml">
    <link rel="mask-icon" href="/mask-icon.svg" color="#FFFFFF" />
    <style>
      /* Force scrollbar to always be visible to prevent layout shift */
      html {
        overflow-y: scroll;
      }
      
      body {
        background-color: #000000; /* black */
        color: #f5f5f5; /* neutral-100 */
      }
      
      /* Global override to prevent serif fonts in font-mono */
      .font-mono {
        font-family: inherit !important;
        font-variant-numeric: tabular-nums !important;
      }

      /* WCAG 2.4.7 / 2.4.13 Visible keyboard focus indicator */
      :focus-visible {
        outline: 2px solid #f59e0b !important;
        outline-offset: 2px !important;
      }

      /* WCAG 2.3.3 Respect reduced motion preferences */
      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
          scroll-behavior: auto !important;
        }
      }
      /* Custom scrollbar for webkit */
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #0a0a0a;
      }
      ::-webkit-scrollbar-thumb {
        background: #404040;
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #525252;
      }

      /* Print styles for PDF export */
      @media print {
        body {
          background-color: white !important;
          color: black !important;
        }
        nav, .no-print, button {
          display: none !important;
        }
        .bg-neutral-900\/20, .bg-neutral-900\/30 {
          background-color: #f3f4f6 !important;
          border-color: #e5e7eb !important;
        }
        .text-white, .text-neutral-100, .text-neutral-200 {
          color: black !important;
        }
        .text-neutral-500, .text-neutral-600 {
          color: #4b5563 !important;
        }
        .border-neutral-800, .border-neutral-800\/50 {
          border-color: #d1d5db !important;
        }
        canvas, .recharts-surface {
          max-width: 100% !important;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
