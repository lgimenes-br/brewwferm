# Copia da configuracao do nginx em producao (/etc/nginx/sites-available/default). Nao e aplicada pelo deploy.
# 17/11/2026: X-Real-IP/X-Forwarded-For em /api/ e /firmware (sem eles o backend via todos como 127.0.0.1).
# 22/11/2026: cabecalhos de seguranca, proxy para 127.0.0.1 (a API so escuta ai) e server_tokens off no nginx.conf.

server {
    server_name breww.live www.breww.live; # Se seu domínio for outro, altere aqui
    # Sempre HTTPS (1 ano)
    add_header Strict-Transport-Security "max-age=31536000" always;

    # 1. Frontend (Arquivos do React que você vai subir via SCP)
    root /var/www/breww.live/html;
    index index.html;

    # Redireciona tudo para o index.html (para o React Router funcionar)
    location / {
        try_files $uri $uri/ /index.html;
        # Cabecalhos de seguranca das paginas (a API manda os proprios). Um add_header aqui substitui os
        # do server, entao o HSTS se repete.
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # 2. Backend (Sua API na porta 3000)
    location /api/ {
        proxy_pass http://127.0.0.1:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

	
# Redireciona /firmware para o Node.js na porta 3000
    location ^~ /firmware {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/breww.live/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/breww.live/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot


}
server {
    if ($host = www.breww.live) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = breww.live) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name breww.live www.breww.live;
    return 404; # managed by Certbot




}
