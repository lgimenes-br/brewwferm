# Copia da configuracao do nginx em producao (/etc/nginx/sites-available/default). Nao e aplicada pelo deploy.
# 17/11/2026: X-Real-IP/X-Forwarded-For em /api/ e /firmware (sem eles o backend via todos como 127.0.0.1).

server {
    server_name breww.live www.breww.live; # Se seu domínio for outro, altere aqui

    # 1. Frontend (Arquivos do React que você vai subir via SCP)
    root /var/www/breww.live/html;
    index index.html;

    # Redireciona tudo para o index.html (para o React Router funcionar)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 2. Backend (Sua API na porta 3000)
    location /api/ {
        proxy_pass http://localhost:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 3. MQTT via WebSocket (Porta 9001 do Mosquitto)
    location /mqtt {
        proxy_pass http://localhost:9001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
    }
	
# Redireciona /firmware para o Node.js na porta 3000
    location ^~ /firmware {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/breww.live/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/breww.live/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot


}
server {
    if ($host = www.breww.live) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = breww.live) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name breww.live www.breww.live;
    return 404; # managed by Certbot




}
