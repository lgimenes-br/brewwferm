# ============================================================================
# Mosquitto ACL Configuration — BREWW Platform (Fase 2 Security Hardening)
# ============================================================================
# Como ativar na VPS (/etc/mosquitto/mosquitto.conf):
#   allow_anonymous false
#   password_file /etc/mosquitto/passwd
#   acl_file /etc/mosquitto/acl.conf
#
# Para criar um usuário exclusivo para o backend Node.js:
#   sudo mosquitto_passwd /etc/mosquitto/passwd breww_server
#   (e defina MQTT_USER=breww_server e MQTT_PASS=<senha> no backend/.env)
# ============================================================================

# 1. Backend Node.js (acesso total de leitura e escrita em todos os tópicos)
user breww_server
topic readwrite brewbrother/#

# 2. Placas ESP32 e Clientes Web autenticados como esp32user
#    - Podem publicar telemetria/status/response/ota/device_action das placas
#    - Podem ler comandos enviados pelo servidor e avisos globais de update
#    - Comandos críticos da web passam pelo endpoint autenticado POST /api/devices/:serial/command
user esp32user
topic readwrite brewbrother/+/data
topic readwrite brewbrother/+/status
topic readwrite brewbrother/+/response
topic readwrite brewbrother/+/ota
topic readwrite brewbrother/+/device_action
topic readwrite brewbrother/+/comando
topic readwrite brewbrother/+/command
topic read brewbrother/global/update
topic readwrite brewbrother/global/ping
