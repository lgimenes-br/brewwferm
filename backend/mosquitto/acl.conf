# ============================================================================
# Mosquitto ACL Configuration — BREWW Platform (Fase 2 Security Hardening)
# ============================================================================
# Como ativar na VPS (/etc/mosquitto/mosquitto.conf):
#   allow_anonymous false
#   password_file /etc/mosquitto/passwd
#   acl_file /etc/mosquitto/acl.conf
#
# Para criar um usuário exclusivo para o backend Node.js:
#   sudo mosquitto_passwd /etc/mosquitto/passwd breww_server
#   (e defina MQTT_USER=breww_server e MQTT_PASS=<senha> no backend/.env)
# ============================================================================

# 1. Backend Node.js (acesso total de leitura e escrita em todos os tópicos)
user breww_server
topic readwrite brewbrother/#

# 2. Placas com credencial PROPRIA (usuario = serial do aparelho)
#    A credencial e criada pelo backend quando a placa se anuncia por HTTPS autenticado
#    (senha = HMAC da chave secreta da placa). Cada placa so publica e le nos SEUS topicos:
#    "%u" e substituido pelo usuario conectado.
pattern write brewbrother/%u/data
pattern write brewbrother/%u/status
pattern write brewbrother/%u/response
pattern write brewbrother/%u/ota
pattern write brewbrother/%u/device_action
pattern write brewbrother/%u/diag
pattern read brewbrother/%u/command
pattern read brewbrother/%u/comando

# 3. LEGADO: credencial compartilhada (esp32user) — so enquanto existirem placas com
#    firmware antigo. Removida do passwd quando KEEP_LEGACY_DEVICE_USER=0 no
#    setup-vps-mosquitto.sh. Mesmo aqui, NAO pode publicar comandos.
user esp32user
topic write brewbrother/+/data
topic write brewbrother/+/status
topic write brewbrother/+/response
topic write brewbrother/+/ota
topic write brewbrother/+/device_action
topic read brewbrother/+/comando
topic read brewbrother/+/command
topic read brewbrother/global/update
topic write brewbrother/global/ping
